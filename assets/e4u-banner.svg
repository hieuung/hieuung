<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="E4u - Engineer banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.6" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="16" fill="url(#glow)"/>

  <!-- Monogram -->
  <g transform="translate(96 100)">
    <rect width="120" height="120" rx="28" fill="url(#accent)"/>
    <text x="60" y="76" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="46" font-weight="800" fill="#0f172a">E4</text>
  </g>

  <!-- Text -->
  <text x="252" y="156" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">E4u</text>
  <text x="254" y="198" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Building scalable platforms &amp; AI-ready services</text>

  <!-- Pills -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#e2e8f0">
    <rect x="254" y="226" width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="306" y="248" text-anchor="middle">Python</text>
    <rect x="370" y="226" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="435" y="248" text-anchor="middle">Kubernetes</text>
    <rect x="512" y="226" width="164" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="594" y="248" text-anchor="middle">Data Platforms</text>
    <rect x="688" y="226" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="753" y="248" text-anchor="middle">AI Tooling</text>
  </g>

  <!-- Decorative terminal window -->
  <g transform="translate(900 70)" opacity="0.95">
    <rect width="300" height="180" rx="14" fill="#0b1020" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="22" cy="22" r="6" fill="#f87171"/>
    <circle cx="42" cy="22" r="6" fill="#fbbf24"/>
    <circle cx="62" cy="22" r="6" fill="#34d399"/>
    <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16">
      <text x="24" y="68" fill="#34d399">$</text>
      <text x="42" y="68" fill="#e2e8f0">whoami</text>
      <text x="24" y="96" fill="#38bdf8">e4u</text>
      <text x="24" y="130" fill="#34d399">$</text>
      <text x="42" y="130" fill="#e2e8f0">ship --scale</text>
      <rect x="24" y="146" width="10" height="18" fill="#a78bfa"/>
    </g>
  </g>
</svg>
